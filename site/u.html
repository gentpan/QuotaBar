<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>[[Quota Run profile · QuotaBar||Quota Run 个人主页 · QuotaBar]]</title>
<meta name="description" content="[[A builder's Quota Run profile: personal bests on each quota board, recent runs and the projects they build.||一位开发者的 Quota Run 主页：各个额度榜单上的最好成绩、最近几轮，以及正在做的项目。]]">
<meta name="theme-color" content="#ffffff">
[[<!-- /@username 由 Caddy 改写到这个文件。英文在根目录；浏览器语言是中文、或者之前选过中文的，去 /zh/@username。 -->
<script>try{var l=localStorage.getItem("qb-lang"),n=navigator.languages&&navigator.languages[0]?navigator.languages[0]:navigator.language;if(l==="zh"?true:!l&&/^zh\b/i.test(String(n)))location.replace("zh/"+location.pathname.split("/").pop()+location.search+location.hash)}catch(e){}</script>
||]]<!-- 同一个文件服务所有用户：canonical 与 hreflang 由 profile.js 按用户名补上 -->
<meta property="og:title" content="[[Quota Run profile||Quota Run 个人主页]]">
<meta property="og:description" content="[[Personal bests, recent runs and projects on Quota Run, QuotaBar's opt-in leaderboard.||Quota Run 上的最好成绩、最近几轮和项目。Quota Run 是 QuotaBar 的自愿排行榜。]]">
<meta property="og:type" content="profile">
<meta property="og:site_name" content="QuotaBar">
<meta property="og:locale" content="[[en_US||zh_CN]]">
<meta property="og:locale:alternate" content="[[zh_CN||en_US]]">
<meta property="og:image" content="https://quota.run/assets/[[og.jpg||og-zh.jpg]]?v={{v}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://quota.run/assets/[[og.jpg||og-zh.jpg]]?v={{v}}">
<link rel="icon" type="image/png" sizes="256x256" href="{{root}}assets/icon.png?v={{v}}">
<link rel="icon" sizes="48x48" href="/favicon.ico?v={{v}}">
<link rel="apple-touch-icon" sizes="180x180" href="{{root}}assets/apple-touch-icon.png?v={{v}}">
<link rel="stylesheet" href="{{root}}base.css?v={{v}}">
<link rel="stylesheet" href="{{root}}ui.css?v={{v}}">
<link rel="stylesheet" href="{{root}}pages.css?v={{v}}">
<link rel="stylesheet" href="{{root}}profile.css?v={{v}}">
<!-- 自建统计。defer，不阻塞渲染；跨域脚本不参与本站的 ?v= 指纹。 -->
<script defer src="https://tongji.giantaccel.com/script.js" data-website-id="8085631e-cc5d-4563-819f-ddd04c1bdcfa"></script>
</head>
<body data-run-page="profile">
{{nav}}

<main class="shell profile" id="main" aria-live="polite" aria-busy="true">
  <!-- profile.js 按 /@username（或 ?user=）读 /api/v1/users/<username>，把整页画在这里。
       没跑 JS 时留下这一段加载骨架和下面的说明。 -->
  <div class="phead" aria-hidden="true">
    <span class="skel av--xl skel--round"></span>
    <div class="phead__text"><span class="skel skel--title"></span><span class="skel skel--line"></span></div>
  </div>
  <div class="kpis kpis--4 psec" aria-hidden="true">
    <div class="kpi"><span class="skel skel--short"></span><span class="kpi__v"><span class="skel skel--value"></span></span></div>
    <div class="kpi"><span class="skel skel--short"></span><span class="kpi__v"><span class="skel skel--value"></span></span></div>
    <div class="kpi"><span class="skel skel--short"></span><span class="kpi__v"><span class="skel skel--value"></span></span></div>
    <div class="kpi"><span class="skel skel--short"></span><span class="kpi__v"><span class="skel skel--value"></span></span></div>
  </div>
  <p class="sr-only" role="status">[[Loading the profile…||正在加载主页…]]</p>
  <noscript><p class="note">[[This profile is drawn from Quota Run's public API and needs JavaScript.||这个主页的内容来自 Quota Run 的公开接口，需要开启 JavaScript。]]</p></noscript>
</main>

{{footer}}

<script type="application/json" id="run-providers">{{run_providers}}</script>
<script src="{{root}}common.js?v={{v}}"></script>
<script src="{{root}}ui.js?v={{v}}"></script>
<script src="{{root}}profile.js?v={{v}}"></script>
</body>
</html>
