<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>[[Usage board · Quota Run||用量榜 · Quota Run]]</title>
<meta name="description" content="[[Who spends the most on AI coding this week: estimated cost and tokens from Claude Code, Codex and OpenCode, verified against quota readings, live.||这周谁在 AI 编程上花得最多：来自 Claude Code、Codex、OpenCode 的等价花费和 token，用额度读数核实，实时更新。]]">
<meta name="theme-color" content="#ffffff">
[[<!-- Caddy 把 /usage 映射到这个文件。英文在根目录；浏览器语言是中文、或者之前选过中文的，去 /zh/usage。 -->
<script>try{var l=localStorage.getItem("qb-lang"),n=navigator.languages&&navigator.languages[0]?navigator.languages[0]:navigator.language;if(l==="zh"?true:!l&&/^zh\b/i.test(String(n)))location.replace("zh/"+location.pathname.split("/").pop()+location.search+location.hash)}catch(e){}</script>
||]]<link rel="canonical" href="{{run_url}}usage">
<link rel="alternate" hreflang="en" href="https://quota.run/usage">
<link rel="alternate" hreflang="zh-CN" href="https://quota.run/zh/usage">
<link rel="alternate" hreflang="x-default" href="https://quota.run/usage">
<meta property="og:title" content="[[Usage board · Quota Run||用量榜 · Quota Run]]">
<meta property="og:type" content="website">
<meta property="og:site_name" content="QuotaBar">
<meta property="og:image" content="https://quota.run/assets/[[og.jpg||og-zh.jpg]]?v={{v}}">
<link rel="icon" type="image/png" sizes="256x256" href="{{root}}assets/icon.png?v={{v}}">
<link rel="icon" sizes="48x48" href="/favicon.ico?v={{v}}">
<link rel="apple-touch-icon" sizes="180x180" href="{{root}}assets/apple-touch-icon.png?v={{v}}">
<link rel="stylesheet" href="{{root}}base.css?v={{v}}">
<link rel="stylesheet" href="{{root}}ui.css?v={{v}}">
<link rel="stylesheet" href="{{root}}pages.css?v={{v}}">
<script defer src="https://tongji.giantaccel.com/script.js" data-website-id="8085631e-cc5d-4563-819f-ddd04c1bdcfa"></script>
</head>
<body data-run-page="usage">
{{nav}}

<main class="shell page" id="main" aria-busy="true">
  <header class="page__head">
    <div class="page__title">
      <p class="eyebrow"><span class="eyebrow__dot" aria-hidden="true"></span>[[Usage board||用量榜]]</p>
      <h1 id="usageTitle">[[Who spends the most on AI coding||谁在 AI 编程上花得最多]]</h1>
      <p class="page__lede" id="usageLede">[[Estimated cost from Claude Code, Codex and OpenCode, priced by quota.run at list rates.||来自 Claude Code、Codex、OpenCode 的等价花费，由 quota.run 按公开价目统一计算。]]</p>
    </div>
    <div class="page__live" id="usageLive"></div>
  </header>

  <div class="filters page__filters" role="group" aria-label="[[Filters||筛选]]">
    <div class="seg" id="periodSeg" role="group" aria-label="[[Period||时间]]">
      <button type="button" data-value="week" aria-pressed="true">[[This week||本周]]</button>
      <button type="button" data-value="last" aria-pressed="false">[[Last week||上周]]</button>
      <button type="button" data-value="month" aria-pressed="false">[[This month||本月]]</button>
      <button type="button" data-value="all" aria-pressed="false">[[365 days||近一年]]</button>
    </div>
    <div class="seg" id="metricSeg" role="group" aria-label="[[Ranked by||排名依据]]">
      <button type="button" data-value="cost" aria-pressed="true">[[Cost||花费]]</button>
      <button type="button" data-value="tokens" aria-pressed="false">Token</button>
      <button type="button" data-value="streak" aria-pressed="false">[[Streak||连续天数]]</button>
      <button type="button" data-value="active" aria-pressed="false">[[Active days||活跃天数]]</button>
    </div>
    <span class="filters__spacer"></span>
    <label class="select select--sm"><span class="sr-only">[[Tool||工具]]</span>
      <select id="toolSelect">
        <option value="">[[Every tool||全部工具]]</option>
        <option value="claude">Claude Code</option>
        <option value="codex">Codex</option>
        <option value="opencode">OpenCode</option>
      </select>
    </label>
    <label class="select select--sm"><span class="sr-only">[[Region||地区]]</span>
      <select id="regionSelect">
        <option value="">[[Everywhere||全部地区]]</option>
        <option value="global">[[Global||国际]]</option>
        <option value="china">[[China||中国]]</option>
      </select>
    </label>
    <label class="switch" title="[[Main board: only days whose quota readings rose. Off shows every upload, OpenCode included.||主榜：只算额度读数确实上涨的日子。关掉就是全部上传的用量，包括 OpenCode。]]">
      <input type="checkbox" id="verifiedSwitch" checked>
      <span class="switch__track" aria-hidden="true"></span>
      <span class="switch__label">[[Verified only||只看已核实]]</span>
    </label>
  </div>

  <div id="usageBody">
    <div class="tiles" style="--tiles:4" aria-hidden="true">
      <div class="tile"><span class="skel skel--short"></span><span class="skel skel--value"></span></div>
      <div class="tile"><span class="skel skel--short"></span><span class="skel skel--value"></span></div>
      <div class="tile"><span class="skel skel--short"></span><span class="skel skel--value"></span></div>
      <div class="tile"><span class="skel skel--short"></span><span class="skel skel--value"></span></div>
    </div>
    <p class="sr-only" role="status">[[Loading the usage board…||正在加载用量榜…]]</p>
  </div>
  <noscript><p class="note">[[The usage board is drawn from Quota Run's public API and needs JavaScript.||用量榜的内容来自 Quota Run 的公开接口，需要开启 JavaScript。]]</p></noscript>
</main>

{{footer}}

<script type="application/json" id="run-providers">{{run_providers}}</script>
<script src="{{root}}common.js?v={{v}}"></script>
<script src="{{root}}ui.js?v={{v}}"></script>
<script src="{{root}}usage.js?v={{v}}"></script>
</body>
</html>
