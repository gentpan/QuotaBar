<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>[[Project board · Quota Run||项目榜 · Quota Run]]</title>
<meta name="description" content="[[The projects people are building with AI right now, ranked by what they cost this week, with each project&#39;s tools and trend.||大家正在用 AI 做的项目，按本周花费排名，附上每个项目用的工具和走势。]]">
<meta name="theme-color" content="#ffffff">
[[<!-- Caddy 把 /projects 映射到这个文件。英文在根目录；浏览器语言是中文、或者之前选过中文的，去 /zh/projects。 -->
<script>try{var l=localStorage.getItem("qb-lang"),n=navigator.languages&&navigator.languages[0]?navigator.languages[0]:navigator.language;if(l==="zh"?true:!l&&/^zh\b/i.test(String(n)))location.replace("zh/"+location.pathname.split("/").pop()+location.search+location.hash)}catch(e){}</script>
||]]<link rel="canonical" href="{{run_url}}projects">
<link rel="alternate" hreflang="en" href="https://quota.run/projects">
<link rel="alternate" hreflang="zh-CN" href="https://quota.run/zh/projects">
<link rel="alternate" hreflang="x-default" href="https://quota.run/projects">
<meta property="og:title" content="[[Project board · Quota Run||项目榜 · Quota Run]]">
<meta property="og:type" content="website">
<meta property="og:site_name" content="QuotaBar">
<meta property="og:image" content="https://quota.run/assets/[[og.jpg||og-zh.jpg]]?v={{v}}">
<link rel="icon" type="image/png" sizes="256x256" href="{{root}}assets/icon.png?v={{v}}">
<link rel="icon" sizes="48x48" href="/favicon.ico?v={{v}}">
<link rel="apple-touch-icon" sizes="180x180" href="{{root}}assets/apple-touch-icon.png?v={{v}}">
<link rel="stylesheet" href="{{root}}base.css?v={{v}}">
<link rel="stylesheet" href="{{root}}ui.css?v={{v}}">
<link rel="stylesheet" href="{{root}}pages.css?v={{v}}">
<script defer src="https://tongji.giantaccel.com/script.js" data-website-id="8085631e-cc5d-4563-819f-ddd04c1bdcfa"></script>
</head>
<body data-run-page="projects">
{{nav}}

<main class="shell page" id="main" aria-busy="true">
  <header class="page__head">
    <div class="page__title">
      <p class="eyebrow"><span class="eyebrow__dot" aria-hidden="true"></span>[[Project board||项目榜]]</p>
      <h1>[[What people are building with AI||大家在用 AI 做什么]]</h1>
      <p class="page__lede">[[Projects their owners made public from QuotaBar, ranked by estimated cost. Private projects never appear.||由作者在 QuotaBar 里主动公开的项目，按等价花费排名。不公开的项目永远不会出现在这里。]]</p>
    </div>
    <div class="page__live" id="projectsLive"></div>
  </header>

  <div class="filters page__filters" role="group" aria-label="[[Filters||筛选]]">
    <div class="seg" id="periodSeg" role="group" aria-label="[[Period||时间]]">
      <button type="button" data-value="week" aria-pressed="true">[[This week||本周]]</button>
      <button type="button" data-value="last" aria-pressed="false">[[Last week||上周]]</button>
      <button type="button" data-value="month" aria-pressed="false">[[This month||本月]]</button>
      <button type="button" data-value="all" aria-pressed="false">[[365 days||近一年]]</button>
    </div>
    <span class="filters__spacer"></span>
    <label class="select select--sm"><span class="sr-only">[[Tool||工具]]</span>
      <select id="toolSelect">
        <option value="">[[Every tool||全部工具]]</option>
        <option value="claude">Claude Code</option>
        <option value="codex">Codex</option>
        <option value="opencode">OpenCode</option>
      </select>
    </label>
  </div>

  <div id="projectsBody">
    <div class="pcards" aria-hidden="true">
      <div class="card"><span class="skel skel--title"></span><span class="skel skel--line"></span><span class="skel skel--short"></span></div>
      <div class="card"><span class="skel skel--title"></span><span class="skel skel--line"></span><span class="skel skel--short"></span></div>
      <div class="card"><span class="skel skel--title"></span><span class="skel skel--line"></span><span class="skel skel--short"></span></div>
    </div>
    <p class="sr-only" role="status">[[Loading projects…||正在加载项目…]]</p>
  </div>
  <noscript><p class="note">[[The project board is drawn from Quota Run&#39;s public API and needs JavaScript.||项目榜的内容来自 Quota Run 的公开接口，需要开启 JavaScript。]]</p></noscript>
</main>

{{footer}}

<script type="application/json" id="run-providers">{{run_providers}}</script>
<script src="{{root}}common.js?v={{v}}"></script>
<script src="{{root}}ui.js?v={{v}}"></script>
<script src="{{root}}projects.js?v={{v}}"></script>
</body>
</html>
