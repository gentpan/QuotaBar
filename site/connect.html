<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>[[Connect a Mac · Quota Run||连接 Mac · Quota Run]]</title>
<meta name="description" content="[[Approve a Mac running QuotaBar so it can upload readings to your Quota Run account.||批准一台运行 QuotaBar 的 Mac，让它往你的 Quota Run 账号上传读数。]]">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff">
[[<!-- QuotaBar 打开的就是这一页：/connect?code=ABCD-EFGH，Caddy 映射到这个文件。浏览器语言是中文、或者之前选过中文的，去 /zh/connect（带上连接码）。 -->
<script>try{var l=localStorage.getItem("qb-lang"),n=navigator.languages&&navigator.languages[0]?navigator.languages[0]:navigator.language;if(l==="zh"?true:!l&&/^zh\b/i.test(String(n)))location.replace("zh/"+location.pathname.split("/").pop()+location.search+location.hash)}catch(e){}</script>
||]]<link rel="canonical" href="{{run_url}}connect">
<link rel="icon" type="image/png" sizes="256x256" href="{{root}}assets/icon.png?v={{v}}">
<link rel="icon" sizes="48x48" href="/favicon.ico?v={{v}}">
<link rel="apple-touch-icon" sizes="180x180" href="{{root}}assets/apple-touch-icon.png?v={{v}}">
<link rel="stylesheet" href="{{root}}base.css?v={{v}}">
<link rel="stylesheet" href="{{root}}account.css?v={{v}}">
<!-- 登录、账号、连接三页不挂统计脚本：地址里有 next 和连接码，不往第三方送。 -->
</head>
<body class="accpage" data-run-page="connect">
{{nav}}

<main class="shell acc-main acc-main--center" id="main">
  <!-- account.js 按 ?code= 读 /api/v1/connect/<code>，把请求、结果或者输入框画在这里 -->
  <div class="acc-card acc-card--wide" id="connectCard" aria-live="polite" aria-busy="true">
    <div class="acc-loading" role="status">
      <span class="sr-only">[[Loading the connection request…||正在读取连接请求…]]</span>
      <span class="skel skel--title"></span>
      <span class="skel skel--line"></span>
      <span class="skel skel--short"></span>
    </div>
  </div>
  <noscript><p class="note">[[Connecting a Mac needs JavaScript.||连接 Mac 需要开启 JavaScript。]]</p></noscript>
</main>

{{footer}}

<script src="{{root}}common.js?v={{v}}"></script>
<script src="{{root}}account.js?v={{v}}"></script>
</body>
</html>
