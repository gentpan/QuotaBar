<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<!-- /@username/slug 比页面文件深一层：相对地址（样式、脚本、顶栏链接）都按站点根目录解析 -->
<base href="[[/||/zh/]]">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>[[Project · Quota Run||项目 · Quota Run]]</title>
<meta name="description" content="[[A project on Quota Run: what it costs to build with AI, day by day, by tool and model.||Quota Run 上的一个项目：用 AI 做它每天花多少、用了哪些工具和模型。]]">
<meta name="theme-color" content="#ffffff">
[[<!-- Caddy 把 /project 映射到这个文件。英文在根目录；浏览器语言是中文、或者之前选过中文的，去 /zh/project。 -->
<script>try{var l=localStorage.getItem("qb-lang"),n=navigator.languages&&navigator.languages[0]?navigator.languages[0]:navigator.language;if(l==="zh"?true:!l&&/^zh\b/i.test(String(n))){var p=location.pathname;location.replace((/^\/@/.test(p)?"/zh"+p:"zh/"+p.split("/").pop())+location.search+location.hash)}}catch(e){}</script>
||]]<!-- 同一个文件服务每个项目：canonical 与 hreflang 由 project.js 按地址补上 -->
<meta property="og:title" content="[[Project · Quota Run||项目 · Quota Run]]">
<meta property="og:type" content="website">
<meta property="og:site_name" content="QuotaBar">
<meta property="og:image" content="https://quota.run/assets/[[og.jpg||og-zh.jpg]]?v={{v}}">
<link rel="icon" type="image/png" sizes="256x256" href="{{root}}assets/icon.png?v={{v}}">
<link rel="icon" sizes="48x48" href="/favicon.ico?v={{v}}">
<link rel="apple-touch-icon" sizes="180x180" href="{{root}}assets/apple-touch-icon.png?v={{v}}">
<link rel="stylesheet" href="{{root}}base.css?v={{v}}">
<link rel="stylesheet" href="{{root}}ui.css?v={{v}}">
<link rel="stylesheet" href="{{root}}pages.css?v={{v}}">
<script defer src="https://tongji.giantaccel.com/script.js" data-website-id="8085631e-cc5d-4563-819f-ddd04c1bdcfa"></script>
</head>
<body data-run-page="project">
{{nav}}

<main class="shell page" id="main" aria-busy="true">
  <!-- project.js 按 /@username/slug（或 ?user=&slug=）读 /api/v1/users/<username>/projects/<slug>，把整页画在这里。 -->
  <div class="phead2" aria-hidden="true">
    <div class="phead2__title"><span class="skel skel--title"></span><span class="skel skel--line"></span></div>
  </div>
  <p class="sr-only" role="status">[[Loading the project…||正在加载项目…]]</p>
  <noscript><p class="note">[[This page is drawn from Quota Run&#39;s public API and needs JavaScript.||这个页面的内容来自 Quota Run 的公开接口，需要开启 JavaScript。]]</p></noscript>
</main>

{{footer}}

<script type="application/json" id="run-providers">{{run_providers}}</script>
<script src="{{root}}common.js?v={{v}}"></script>
<script src="{{root}}ui.js?v={{v}}"></script>
<script src="{{root}}project.js?v={{v}}"></script>
</body>
</html>
